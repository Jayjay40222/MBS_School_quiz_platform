<!DOCTYPE html>
<html>

<head>
    <title>Makko Billi School - Change Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/change_pass_style.css">
</head>

<body>

    <div class="blob b1"></div>
    <div class="blob b2"></div>

    <div class="card">

        <div class="logo">
            <img src="https://z-cdn-media.chatglm.cn/files/d417782e-8404-4b0a-9b5d-d8393e18ea19.jpg"
                alt="Makko Billi School">
        </div>

        <div class="app-name">Makko Billi School</div>
        <h1>Change Password</h1>

        <form action="/change_password" method="POST" id="form">
            <div class="input-group">
                <label>New Password</label>

                <div class="input-wrapper">
                    <input type="password" id="newPassword" name="new_password"
                        placeholder="Enter new password" required>
                    <button class="eye-btn" type="button" id="eyeBtn">👁</button>
                </div>

                <div class="strength-bar" id="strengthBar">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>

                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="warning">
                Don’t forget this password. If lost, you cannot recover it.
            </div>

            <button class="save-btn" type="submit">Save Password</button>
        </form>
    </div>

    <script>
        const passwordInput = document.getElementById('newPassword');
        const eyeBtn = document.getElementById('eyeBtn');
        const bars = document.querySelectorAll('#strengthBar .bar');
        const strengthText = document.getElementById('strengthText');
        const form = document.getElementById('form');

        // Toggle password visibility
        eyeBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeBtn.textContent = isPassword ? '🙈' : '👁';
        });

        // Password strength logic
        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let score = 0;

            if (val.length >= 4) score = 1;
            if (val.length >= 6) score = 2;
            if (val.length >= 8) score = 3;

            bars.forEach((bar, i) => {
                bar.className = 'bar';

                if (i < score) {
                    if (score === 3) {
                        bar.classList.add('strong');
                    } else if (score === 2) {
                        bar.classList.add('medium');
                    } else {
                        bar.classList.add('weak');
                    }
                }
            });

            const labels = ['', 'Weak', 'Medium', 'Strong'];
            strengthText.textContent = val ? labels[score] : '';
        });

        // Validate before submit
        form.addEventListener('submit', (e) => {
            const val = passwordInput.value.trim();

            if (val.length < 4) {
                e.preventDefault();
                alert("Password too short!");
            }
        });
    </script>

</body>

</html>
