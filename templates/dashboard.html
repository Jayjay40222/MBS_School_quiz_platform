<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MBS School Quiz Platform</title>
    <link rel="stylesheet" href="/static/dashboard_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="topbar">
    <div>🎓 MBS Quiz</div>
    <div><i class="fas fa-fire"></i> Streak: <span id="streak">0</span></div>
</div>

<div id="home" class="page active">
    <div class="info">
        <h3>🔥 Welcome, <span id="welcomeName">{{.FullName}}</span></h3>
        <p>
            MBS School Quiz Platform is a web application designed to facilitate online quizzes for students.
        </p>
    </div>
</div>

<div class="nav" role="navigation" aria-label="Primary">
    <a href="/dashboard" class="tab" data-path="/home" aria-label="Home">
        <i class="fas fa-home" aria-hidden="true"></i>
        <span class="tab-title">Home</span>
    </a>

    <a href="/quiz" class="tab" data-path="/quiz" aria-label="Quizzes">
        <i class="fas fa-question" aria-hidden="true"></i>
        <span class="tab-title">Quizzes</span>
    </a>

    <a href="/board" class="tab" data-path="/board" aria-label="Leaderboard">
        <i class="fas fa-trophy" aria-hidden="true"></i>
        <span class="tab-title">Leaderboard</span> 
    </a>

    <a href="/profile" class="tab" data-path="/profile" aria-label="Profile">
        <i class="fas fa-user" aria-hidden="true"></i>
        <span class="tab-title">Profile</span>
    </a>
</div>

<script src="/static/app.js"></script>
</body>
</html>
