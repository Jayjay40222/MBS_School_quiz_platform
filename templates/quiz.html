<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz</title>
    <link rel="stylesheet" href="/static/dashboard_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="topbar">
    <div>🎓 MBS Quiz</div>
     <div><i class="fas fa-fire"></i> Streak: <span id="streak">{{.Streak}}</span></div>
</div>

<div id="quiz" class="page active">
    <h1 style="text-align: center;padding: 40px;">❓ Quiz</h1>
    <div class="pointsBox">
        ⭐ Points: <span id="points">{{.Points}}</span>
    </div>

    <div class="grid">
        <a class="card" href="/quiz/worksheet">📄 Worksheet</a>
        <a href="/quiz/play?subject=Math&grade={{ .Grade }}" class="card">📐 Math</a>
        <a href="/quiz/play?subject=English&grade={{.Grade}}" class="card">📘 English</a>
        <a href="/quiz/play?subject=Physics&grade={{.Grade}}" class="card">⚡ Physics</a>
        <a href="/quiz/play?subject=Chemistry&grade={{.Grade}}" class="card">🧪 Chemistry</a>
        <a href="/quiz/play?subject=Biology&grade={{.Grade}}" class="card">🌱 Biology</a>
        <a href="/quiz/play?subject=History&grade={{.Grade}}" class="card">📜 History</a>
        <a href="/quiz/play?subject=Geography&grade={{.Grade}}" class="card">🌍 Geography</a>
        <a href="/quiz/play?subject=Economics&grade={{.Grade}}" class="card">💰 Economics</a>
    </div>

</div>

<div class="nav" role="navigation" aria-label="Primary">
    <a href="/dashboard" class="tab" data-path="/home" aria-label="Home">
        <i class="fas fa-home" aria-hidden="true"></i>
        <span class="tab-title">Home</span>
    </a>

    <a href="/quiz" class="tab" data-path="/quiz" aria-label="Quizzes">
        <i class="fas fa-question" aria-hidden="true"></i>
        <span class="tab-title">Quizzes</span>
    </a>

    <a href="/board" class="tab" data-path="/board" aria-label="Leaderboard">
        <i class="fas fa-trophy" aria-hidden="true"></i>
        <span class="tab-title">Leaderboard</span>
    </a>

    <a href="/profile" class="tab" data-path="/profile" aria-label="Profile">
        <i class="fas fa-user" aria-hidden="true"></i>
        <span class="tab-title">Profile</span>
    </a>
</div>

<script src="/static/app.js"></script>
</body>
</html>
